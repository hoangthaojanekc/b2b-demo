# Company definition for the b2b-demo stack.
# Everything company-, product-, persona-, and channel-specific lives here.
# Swap this file to re-skin the demo for a different B2B target.
# All names below are FICTIONAL.

company:
  name: Meridian Labs
  fictional: true
  tagline: Data and AI for drug discovery and healthcare benefits
  industry: Healthcare and life sciences software
  sales_motion: account_based
  sales_cycle_days:        # 6-12 months, lead created to closed-won
    min: 180
    max: 365

product_lines:
  - id: discover
    name: Meridian Discover
    category: Research data and AI platform for drug discovery
    description: >-
      Unifies assay, omics, and chemistry data so discovery teams can
      prioritize targets and compounds faster.
    personas:
      - id: vp_discovery_research
        title: VP of Discovery Research
        segment: biopharma
        department: Research & Development
        seniority: vp
        committee_role: economic_buyer
        pains:
          - Research data siloed across ELNs, LIMS, and CRO deliverables
          - Slow, costly target-to-hit and hit-to-lead cycles
      - id: principal_scientist
        title: Principal Scientist, Computational Chemistry
        segment: biopharma
        department: Research & Development
        seniority: individual_contributor
        committee_role: technical_evaluator
        pains:
          - More time cleaning data than building models
          - Models trained on inconsistent assay results
    offer:
      type: whitepaper
      slug: ai-ready-research-data
      title: "From Data Silos to Discovery"
      subtitle: >-
        A playbook for AI-ready research data: how discovery teams unify
        assay, omics, and chemistry data to shorten hit-to-lead cycles.
      bullets:
        - A maturity model for research data readiness
        - Harmonizing in-house and CRO assay data without rework
        - Where machine learning helps in early discovery, and where it doesn't
      pages: 20

  - id: benefits
    name: Meridian Benefits
    category: Benefits analytics for health plans and employers
    description: >-
      Combines claims, eligibility, and program data to show which health
      benefits and care programs lower cost and improve outcomes.
    personas:
      - id: vp_population_health
        title: VP of Population Health
        segment: health_plan
        department: Clinical & Population Health
        seniority: vp
        committee_role: economic_buyer
        pains:
          - Can't prove the ROI of care management programs
          - Claims and clinical data live in separate systems
      - id: director_benefits
        title: Director of Benefits
        segment: employer
        department: HR / Total Rewards
        seniority: director
        committee_role: champion
        pains:
          - Healthcare costs rising with little visibility into drivers
          - Hard to compare plan and point-solution vendor performance
    offer:
      type: whitepaper
      slug: benefits-roi-report
      title: "The Benefits ROI Report"
      subtitle: >-
        How health plans and self-insured employers measure which benefits
        and care programs actually reduce cost.
      bullets:
        - A framework for measuring program ROI from claims data
        - Benchmarks for common care management and point solutions
        - Reporting that satisfies both finance and clinical leaders
      pages: 16

# Marketing channels. `id` values are canonical keys used in UTMs,
# HubSpot/Salesforce campaign mapping, and dbt attribution models.
channels:
  - id: linkedin
    label: LinkedIn
    type: paid
    utm_source: linkedin
    utm_medium: paid_social
  - id: email
    label: Email
    type: owned
    utm_source: hubspot
    utm_medium: email
  - id: conference
    label: Conference
    type: paid
    utm_source: event
    utm_medium: conference
  - id: webinar
    label: Webinar
    type: owned
    utm_source: webinar
    utm_medium: webinar
  - id: organic_search
    label: Organic Search
    type: earned
    utm_source: google
    utm_medium: organic
  - id: press
    label: Press
    type: earned
    utm_source: press
    utm_medium: referral

# Tracking IDs. Placeholders until the accounts are created.
# These are public client-side IDs, not secrets. Tokens go in .env.
tracking:
  gtm_container_id: GTM-XXXXXXX
  hubspot_portal_id: PORTAL_ID
  hubspot_region: na1        # na1 or eu1, per the HubSpot account
  hubspot_form_id: FORM_ID
